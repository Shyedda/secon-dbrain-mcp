name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platforms:
    strategy:
      matrix:
        include:
          - os: windows-latest
            python: .venv/Scripts/python.exe
          - os: ubuntu-24.04
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Sistema/requirements-lock.txt
      - run: python Sistema/setup_environment.py
      - run: ${{ matrix.python }} -X utf8 -m pytest Sistema/tests -q -p no:cacheprovider
      - run: python Sistema/runtime_manifest.py --check
