name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Sistema/requirements-lock.txt
      - run: python -m pip install -r Sistema/requirements-lock.txt
      - run: python -X utf8 -m pytest Sistema/tests -q -p no:cacheprovider
